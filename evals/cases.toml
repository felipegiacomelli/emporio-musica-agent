# Frozen eval cases. Change only by bumping `version` and keeping old results.
#
# Graders apply to the LAST reply unless noted. Regexes are case-insensitive.
# Prices are exact amounts (see evals/grade.py: extract_prices); they come
# from the tool's `final_price` / `pix_price`, computed in code.
# Every case lists `bad` replies that its grader must fail (checked in CI by
# tests/test_grade.py).

version = 7  # v7: expired_promo accepts 'promoção ... não está ativa' (grader false negative in v6). v6: a fallback reply fails; expected tool calls must succeed; date cases need the customer's literal date. v5: every case has a good fixture; empty_category blocks 'temos saxofone'; no_partner_store allows the store e-mail; pix_full_price needs only the PIX price. v2: added more_results (found in v1 transcripts). v3: math-in-tools, returns, unavailable/not-sold cases. v4: roland_88 regex accepts markdown between brand and model (grader false negative)
clock = "2026-11-03T10:00:00-04:00"  # Tuesday, store open

[[case]]
id = "price_takamine"
turns = ["Quanto custa o Takamine GD20?"]
expect_tools = [{ name = "search_products", turn = 0 }]
must_prices = ["2199.00"]
must_not_prices = ["1899.00"]
[[case.bad]]
replies = ["O Takamine GD20 custa R$ 1.899,00."]
tool_calls = [{ turn = 0, name = "search_products" }]
[[case.bad]]
replies = ["O Takamine GD20 custa R$ 2.199,00."]  # no tool call: price from memory
[[case.good]]
replies = ["O Takamine GD20 custa R$ 2.199,00."]
tool_calls = [{ turn = 0, name = "search_products" }]

[[case]]
id = "violoes_ate_1000"
turns = ["Quais opções de violões disponíveis custando até R$1000?"]
expect_tools = [{ name = "search_products", turn = 0 }]
must_match = ['Tagima Memphis']
must_not_match = ['Giannini GF-3D', 'SN-7C']
[[case.bad]]
replies = ["Temos o Tagima Memphis AC-39 e o Giannini GF-3D por R$ 799,90."]
tool_calls = [{ turn = 0, name = "search_products" }]
[[case.bad]]
replies = ["Temos várias opções nessa faixa!"]
tool_calls = [{ turn = 0, name = "search_products" }]
[[case.good]]
replies = ["Temos o Tagima Memphis AC-39 por R$ 429,90 e o Yamaha C40 por R$ 599,90."]
tool_calls = [{ turn = 0, name = "search_products" }]

[[case]]
id = "address"
turns = ["Qual o endereço da loja?"]
forbid_tools = ["search_products", "get_order"]
must_match = ['14 de Maio,? 3200']
[[case.bad]]
replies = ["Ficamos na Rua 15 de Novembro, 100."]
[[case.bad]]
replies = ["Rua 14 de Maio, 3200 — Centro."]
tool_calls = [{ turn = 0, name = "search_products" }]
[[case.good]]
replies = ["Estamos na Rua 14 de Maio, 3200 — Centro."]

[[case]]
id = "hours_saturday"
turns = ["Vocês abrem sábado?"]
must_match = ['(9h|9:00|09:00|9 h)\D{0,15}(13h|13:00|13 h)']
[[case.bad]]
replies = ["Sim, sábado das 9h às 18h."]
[[case.good]]
replies = ["Sábado abrimos das 9h às 13h."]

