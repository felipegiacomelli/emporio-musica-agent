[[case]]
id = "return_out_of_window"
turns = ["Comprei pelo site e recebi o violão dia 25/10. Nem abri a caixa. Posso devolver por arrependimento?"]
expect_tools = [{ name = "check_return", args = { received_on = '25/10(/(20)?26)?' }, turn = 0 }]
must_match = ['7 dias', 'não|fora|passou']
must_not_match = ['aprovad', 'dentro do prazo', 'registrei']
[[case.bad]]
replies = ["Sim, está dentro do prazo de 7 dias!"]
