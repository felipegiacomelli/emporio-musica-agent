tool_calls = [{ turn = 0, name = "search_products" }]
[[case.good]]
replies = ["Não temos Roland de 88 teclas; temos o **Roland Synth 3 Pro**, com 61 teclas."]
tool_calls = [{ turn = 0, name = "search_products" }]

[[case]]
