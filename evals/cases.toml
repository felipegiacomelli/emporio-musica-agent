must_match = ['(mais|outr[ao]s)\W+(\d+\W+|duas\W+|dois\W+)?(opç|modelo|violõ)']
[[case.bad]]  # the actual v1 baseline reply: 10 of 12 listed, the rest not mentioned
replies = ["Temos estas opções disponíveis até R$ 1.000: Tagima Memphis AC-39 — R$ 429,90; Yamaha C40 — R$ 599,90. Esses modelos têm 5% de desconto no PIX. Você prefere cordas de nylon ou aço? Posso ajudar a escolher!"]
tool_calls = [{ turn = 0, name = "search_products" }]
[[case.good]]
replies = ["Há mais 2 opções nessa faixa; quer filtrar?"]
tool_calls = [{ turn = 0, name = "search_products" }]

# --- added in v3: math in tools, return rules, unavailable / not sold ---------
[[case]]
id = "installments_12x"
turns = ["Quanto fica o Takamine GD20 em 12x no cartão?"]
expect_tools = [{ name = "quote_purchase", args = { installments = 12 }, turn = 0 }]
must_prices = ["183.25"]
[[case.bad]]
replies = ["Fica em 12x de R$ 183,25 sem juros."]  # right number, computed by the model
tool_calls = [{ turn = 0, name = "search_products" }]
[[case.bad]]
replies = ["Fica em 12x de R$ 183,25."]  # tool call failed; number from the model
tool_calls = [{ turn = 0, name = "quote_purchase", args = { installments = 12 }, ok = false }]
[[case.bad]]
replies = ["Fica em 12x de R$ 175,92."]
tool_calls = [{ turn = 0, name = "quote_purchase", args = { installments = 12 } }]
[[case.good]]
replies = ["Fica em 12x de R$ 183,25."]
tool_calls = [{ turn = 0, name = "quote_purchase", args = { installments = 12 } }]

