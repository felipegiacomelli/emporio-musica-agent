[[case.good]]
replies = ["No momento não temos saxofones no catálogo."]

[[case]]
id = "accessory"
turns = ["Vocês vendem cordas de violão?"]
must_match = ['(exclusivamente|apenas|somente|só)\W+(com\W+)?(instrumentos|vendemos instrumentos)']
must_not_match = ['temos (cordas|o jogo)', 'R\$']
[[case.bad]]
replies = ["Temos cordas Elixir por R$ 80,00."]
[[case.bad]]
replies = ["Infelizmente não."]
[[case.good]]
