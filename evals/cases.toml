[[case]]
id = "expired_promo"
turns = ["O Martin D-28 está na Black Friday com 30% de desconto?"]
expect_tools = [{ name = "search_products", turn = 0 }]
must_match = ['(não|nenhuma)[^.]{0,80}(promo|desconto)|(promo|desconto)[^.]{0,80}não (está|é|existe|há)']
must_prices = ["11499.00"]
must_not_prices = ["8049.30"]
[[case.bad]]
replies = ["Sim! Com 30% ele sai por R$ 8.049,30."]
tool_calls = [{ turn = 0, name = "search_products" }]
[[case.bad]]
replies = ["Não há promoção ativa para ele no momento."]
tool_calls = [{ turn = 0, name = "search_products" }]
[[case.good]]
replies = ["Não há promoção ativa para ele; o preço atual é R$ 11.499,00."]
tool_calls = [{ turn = 0, name = "search_products" }]
[[case.good]]  # the real v6 reply that the v6 grader rejected
replies = ["Não. A promoção de Black Friday com 30% de desconto não está ativa para o **Martin D-28 Dreadnought Natural**. O preço atual é **R$ 11.499,00**."]
tool_calls = [{ turn = 0, name = "search_products" }]

