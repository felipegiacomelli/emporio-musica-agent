[[case.bad]]
replies = ["Não dá, já passaram os 7 dias."]  # right answer, model did the date math
tool_calls = [{ turn = 0, name = "check_return", args = { days_since_receipt = 9 } }]
[[case.good]]
replies = ["Não dá: o prazo de 7 dias após o recebimento já passou."]
tool_calls = [{ turn = 0, name = "check_return", args = { received_on = "25/10" } }]

