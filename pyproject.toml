[project]
name = "emporio"
version = "0.1.0"
description = "Portuguese customer-service agent for Empório da Música"
requires-python = "==3.12.*"
dependencies = [
    "openai==3.35.0",
    "pydantic==2.14.1",
    "pydantic-settings==2.16.0",
    "attrs==26.1.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.1",
    "black==26.10.1",
    "mypy==2.4.0",
    "pre-commit==4.7.0",
]

[tool.setuptools]
packages = ["emporio"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.black]
line-length = 88

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["emporio"]

[tool.coverage.report]
fail_under = 85
